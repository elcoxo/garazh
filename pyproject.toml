[project]
name = "garazh"
version = "0.1.0"
description = "Telegram bot that creates calendar events from forwarded posts"
authors = [{name = "Artem Galoyan", email = "temeets@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "aiogram>=3.29.0",
    "redis>=8.0.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "sqlalchemy-utils>=0.41.2",
    "cryptography>=45.0.0",
    "authlib>=1.6.0",
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    "pydantic-ai-slim[google,groq]>=0.0.20",
    "aiogram-i18n>=1.5",
    "fluent-runtime>=0.4.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["bot", "api", "db", "models", "services", "settings", "system"]
src_paths = ["src"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "flake8-cognitive-complexity>=0.1.0",
    "flake8-comprehensions>=3.17.0",
    "flake8-eradicate>=1.5.0",
    "flake8-quotes>=3.4.0",
    "isort>=8.0.1",
]
