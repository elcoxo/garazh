[project]
name = "garazh"
version = "0.1.0"
description = "Telegram bot that creates calendar events from forwarded posts"
authors = [{name = "Artem Galoyan", email = "temeets@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "aiogram>=3.28.2",
    "redis>=8.0.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "sqlalchemy-utils>=0.41.2",
]

[tool.fastapi]
entrypoint = "main:app"
